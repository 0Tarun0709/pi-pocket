<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111411">
  <title>PockPi</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="brand"><button type="button" class="logo" id="open-sessions" aria-label="Open sessions" aria-haspopup="dialog" aria-controls="session-drawer"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="currentColor"><path d="M0 0 H300 V200 H200 V100 H0 Z"/><path d="M0 100 H100 V200 H200 V300 H100 V400 H0 Z"/><rect x="300" y="200" width="100" height="200"/></svg></button><div><h1 id="active-session-name">PockPi</h1><p class="subtitle" id="active-project"></p></div></div>
      <div class="header-actions">
        <details class="header-menu actions" name="header-menu">
          <summary aria-label="More actions"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></summary>
          <div class="sessions-panel"><strong>Connection actions</strong><label for="theme">Theme</label> <select id="theme" aria-label="Choose color theme">
          <option value="graphite">Graphite</option>
          <option value="light">Light</option>
          <option value="forest">Forest</option>
        </select><p id="browser-label">This browser: checking…</p><button type="button" id="disconnect-tailscale">Turn off Tailscale access</button><button type="button" class="danger" id="stop-all"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>Stop all &amp; disconnect</button></div>
        </details>
      </div>
    </header>
    <main id="conversation" aria-label="Conversation">
      <div id="messages"></div>
      <div class="example" id="notice" role="status">Connecting to Pi…</div>
    </main>
    <footer>
      <div class="composer"><form id="composer"></form><textarea form="composer" id="prompt" rows="2" aria-label="Message Pi" placeholder="Message Pi…"></textarea><div class="composer-row"><details class="header-menu model-picker" name="header-menu">
          <summary>Model</summary>
          <form class="sessions-panel" id="model-form">
            <p id="current-model">Current model: checking…</p>
            <label for="model-choice">Choose a model</label>
            <select id="model-choice" required disabled></select>
            <button type="submit" disabled>Switch model</button>
            <p id="model-notice" role="status"></p>
          </form>
        </details><button form="composer" id="composer-submit" type="submit" aria-label="Send message"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="send-icon" d="M12 19V5m-6 6 6-6 6 6"/><rect class="stop-icon" x="7" y="7" width="10" height="10" rx="2" fill="currentColor" hidden/></svg></button></div></div>
      <div class="session-footer"><span class="badge" id="status">Connecting</span><p class="footnote"></p></div>
    </footer>
  </div>
  <dialog class="session-drawer" id="session-drawer" aria-labelledby="drawer-title">
    <div class="drawer-heading">
      <h2 id="drawer-title">Sessions</h2>
      <button type="button" id="close-sessions" aria-label="Close sessions" autofocus><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </div>
    <input type="search" id="session-search" aria-label="Search shared sessions" placeholder="Search sessions">
    <p id="session-empty">Connecting to Pi…</p>
    <ul class="session-list" hidden></ul>
  </dialog>
  <script src="/marked.js"></script>
  <script src="/purify.js"></script>
  <script src="/highlight.js"></script>
  <script src="/transcript.js"></script>
  <script src="/app.js"></script>
</body>
</html>
