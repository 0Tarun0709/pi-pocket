<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#191b20">
  <title>Pair browser · PockPi</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #101114; color: #eef0f4; }
    * { box-sizing: border-box; }
    body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 420px); padding: 28px; border: 1px solid #454b55; border-radius: 18px; background: #191b20; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 700; }
    .logo { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; background: #a9c7ff; color: #111a29; }
    .logo svg { width: 20px; height: 20px; }
    h1 { margin: 28px 0 10px; font-size: 24px; letter-spacing: -.03em; }
    p { margin: 0; color: #b2b8c2; line-height: 1.55; font-size: 14px; }
    form { margin-top: 26px; }
    label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; }
    input, button { width: 100%; font: inherit; border-radius: 10px; }
    input { padding: 13px; color: #eef0f4; background: #24272e; border: 1px solid #454b55; font-size: 16px; }
    input:focus-visible, button:focus-visible { outline: 2px solid #a9c7ff; outline-offset: 3px; }
    button { margin-top: 12px; padding: 13px; border: 0; background: #a9c7ff; color: #111a29; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 1.5em; margin-top: 14px; color: #f4aaaa; }
    .footnote { margin-top: 20px; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="logo" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="currentColor"><path d="M0 0 H300 V200 H200 V100 H0 Z"/><path d="M0 100 H100 V200 H200 V300 H100 V400 H0 Z"/><rect x="300" y="200" width="100" height="200"/></svg></span>PockPi</div>
    <h1>Pair this browser</h1>
    <p>On your laptop, run <strong>/remote pair</strong> in Pi to pair your phone. For laptop-only access, open <strong>http://127.0.0.1:18790</strong> on the laptop. Scan the QR code or enter the code below.</p>
    <form id="pair-form">
      <label for="code">Pairing code</label>
      <input id="code" name="code" required autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="32">
      <button type="submit">Pair browser</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="footnote">The code expires after two minutes and works once. Keep it private.</p>
  </main>
  <script>
    const form = document.querySelector('#pair-form');
    const input = document.querySelector('#code');
    const status = document.querySelector('#status');
    const button = form.querySelector('button');
    const fragment = new URLSearchParams(location.hash.slice(1));
    const scanned = fragment.get('pair');
    if (location.hash) history.replaceState(null, '', location.pathname);
    async function pair(code) {
      button.disabled = true;
      status.textContent = 'Pairing…';
      try {
        const response = await fetch('/api/pair', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: code.trim() }) });
        if (!response.ok) throw new Error(response.status === 401 ? 'This code is invalid or expired. Run /remote pair for a new one.' : 'Could not pair. Run /remote pair for a new code and try again.');
        location.replace('/');
      } catch (error) {
        status.textContent = error.message || 'Could not connect. Check Tailscale and try again.';
        button.disabled = false;
      }
    }
    form.addEventListener('submit', event => { event.preventDefault(); void pair(input.value); });
    if (scanned) void pair(scanned);
  </script>
</body>
</html>
